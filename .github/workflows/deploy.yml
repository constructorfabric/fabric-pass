name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ideas/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # IDEA-044 — no redeploy step here on purpose. GitHub delivers a
      # `workflow_run` webhook when this run completes, and the droplet
      # verifies its X-Hub-Signature-256 before acting (deploy/webhook/).
      # That keeps the shared secret off the wire entirely, where this step
      # used to send it in full on every single deploy.
